<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Voice Line — Customer Switchboard</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #d4af37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .phone-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .brand-title {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .phone-container h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .mic-status {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 2rem;
      font-family: monospace;
      letter-spacing: 0.05em;
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <main class="phone-container">
    <div class="brand-title">Secure Audio Link</div>
    <h1>Customer Voice Terminal</h1>

    <div class="mic-status" id="micStatus">
      CHECKING MICROPHONE...
    </div>

    <p class="footer-note">
      Click the phone icon in the bottom-right corner to call. Once connected, select the keypad icon inside the call window to use our automated menu.
    </p>
  </main>

  <!-- Live 3CX WebRTC Widget -->
  <call-us-selector phonesystem-url="https://1440.3cx.cloud" party="LiveChat81267"></call-us-selector>
  <script defer src="https://downloads-global.3cx.com/downloads/livechatandtalk/v1/callus.js" id="tcx-callus-js" charset="utf-8"></script>

  <script>
    window.addEventListener('load', () => {
      const status = document.getElementById('micStatus');
      navigator.mediaDevices?.getUserMedia({ audio: true })
        .then(stream => {
          stream.getTracks().forEach(track => track.stop());
          status.textContent = 'READY TO CONNECT';
          status.style.color = '#4ade80';
        })
        .catch(() => {
          status.textContent = 'MICROPHONE PERMISSION NEEDED';
          status.style.color = '#facc15';
        });
    });
  </script>
</body>
</html>
